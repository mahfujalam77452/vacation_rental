<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Vacation Rentals{% endblock %}</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; color: #222; background: #f6f7f9; }
    header { background: #0b5ed7; color: #fff; padding: 14px 24px; }
    header a { color: #fff; text-decoration: none; font-weight: bold; font-size: 20px; }
    .container { max-width: 1100px; margin: 0 auto; padding: 24px; }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>
  <header><a href="{% url 'home' %}">Vacation Rentals</a></header>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
  {% block extra_js %}{% endblock %}
</body>
</html>
